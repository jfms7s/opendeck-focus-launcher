[package]
name = "opendeck-focus-launcher"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "OpenDeck plugin: focus an app's window if it has one, else launch it"
repository = "https://github.com/jfms7s/opendeck-focus-launcher"

[dependencies]
openaction = "2.7"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
freedesktop-desktop-entry = "0.8"
async-trait = "0.1"
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.23"
freedesktop-icons = "0.4"
shell-words = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
