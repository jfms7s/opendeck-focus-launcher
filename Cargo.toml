[package]
name = "opendeck-focus-launcher"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "OpenDeck plugin: focus an app's window if it has one, else launch it"
repository = "https://github.com/jfms7s/opendeck-focus-launcher"

[dependencies]
openaction = "2.5"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
freedesktop-desktop-entry = "0.8"
async-trait = "0.1"
thiserror = "1.0"
zbus = "4"
log = "0.4"
simplelog = "0.12"
tux-icons = "0.5"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
