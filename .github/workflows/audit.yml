name: Audit
# Weekly RustSec check of Cargo.lock, so an advisory published after the last
# push still raises a signal (a failed run emails the owner). The `audit` job
# in ci.yml covers pull requests; release.yml's `verify` covers tags.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
