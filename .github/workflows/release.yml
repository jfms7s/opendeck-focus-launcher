name: Release
# Pushing a vX.Y.Z tag builds and tests that commit (Linux binaries on
# Ubuntu, the macOS one on a macOS runner), then creates a *draft*
# GitHub release with the bundle and its SHA256SUMS attached. Publishing the
# draft (by hand, after the README smoke-test checklist) is what makes it the
# "latest" release that the Ansible role installs, so a release is never
# visible without its asset.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tag matches the Cargo and manifest versions
        run: node build.mjs --check-only --expect-version "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Property inspector tests
        run: node --test tests/*.test.mjs

  build-macos:
    # Native Apple Silicon build. Read-only, like `build`.
    needs: verify
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: |
          bin=target/aarch64-apple-darwin/release/opendeck-focus-launcher
          file "$bin"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
          # Apple Silicon kills unsigned binaries; the linker's ad-hoc
          # signature must survive `strip = true`.
          codesign --verify --verbose "$bin"
          # Without OpenDeck's arguments it stops at the first missing flag,
          # which proves it got as far as main().
          out=$("$bin" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing CLI flag: -port"
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release opendeck-focus-launcher
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  build:
    needs: [verify, build-macos]
    runs-on: ubuntu-24.04
    # Read-only: dependency build scripts run here, with no write token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin
      - name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          bin=target/aarch64-apple-darwin/release/opendeck-focus-launcher
          test -x "$bin"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
      - name: Assemble the universal bundle (every CodePaths target, one manifest)
        run: |
          node build.mjs --all --zip --expect-version "$GITHUB_REF_NAME"
          unzip -Z opendeck-focus-launcher.streamDeckPlugin | grep -E '^-rwx.*opendeck-focus-launcher-aarch64-apple-darwin$'
      - name: Checksums
        run: sha256sum ./*.streamDeckPlugin > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            *.streamDeckPlugin
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # The only job with a write token. It runs no repository code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.streamDeckPlugin
            SHA256SUMS
