name: Release
# Pushing a vX.Y.Z tag tests and audits that commit, builds it (the Linux
# x86_64 binary on Ubuntu, the macOS one on a macOS runner, which also runs
# the tests natively), then creates a *draft* GitHub release with the bundle
# and its SHA256SUMS attached. The draft's notes are the README's smoke-test
# checklist, unticked (scripts/release-body.mjs). Publish it by hand only
# after recording a result for every checklist item in those notes (passed,
# failed, or not run and why): publishing is what makes it the "latest"
# release that the Ansible role installs, and a release is never visible
# without its asset.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tag matches the Cargo and manifest versions
        run: node build.mjs --check-only --expect-version "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Property inspector tests
        run: node --test tests/*.test.mjs
      # A tag can point at a commit that never ran CI: no draft from a
      # lockfile with a known advisory.
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit

  build-macos:
    # Native Apple Silicon build. Read-only, like `build`.
    needs: verify
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The [package] name is the first `name =` line in Cargo.toml.
      - name: Binary name from Cargo.toml
        run: echo "BIN=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      # The macOS-only code is tested natively here: the tag's commit may
      # never have passed CI's `macos` job.
      - run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: scripts/check-macos-binary.sh "target/aarch64-apple-darwin/release/$BIN"
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release "$BIN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  build:
    needs: [verify, build-macos]
    runs-on: ubuntu-24.04
    # Read-only: dependency build scripts run here, with no write token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The [package] name is the first `name =` line in Cargo.toml.
      - name: Binary name from Cargo.toml
        run: echo "BIN=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin
      - name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          scripts/check-macos-binary.sh "target/aarch64-apple-darwin/release/$BIN" --static
      - name: Assemble the universal bundle (every CodePaths target, one manifest)
        run: |
          node build.mjs --all --zip --expect-version "$GITHUB_REF_NAME"
          unzip -Z "$BIN.streamDeckPlugin" | grep -E "^-rwx.*$BIN-aarch64-apple-darwin\$"
      - name: Checksums
        run: sha256sum ./*.streamDeckPlugin > SHA256SUMS
      # After the bundle and checksums, so it is in neither; it only becomes
      # the draft's notes.
      - name: Write the draft's notes (the README smoke checklist, unticked)
        run: node scripts/release-body.mjs > RELEASE_BODY.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            *.streamDeckPlugin
            SHA256SUMS
            RELEASE_BODY.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # The only job with a write token. It runs no repository code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.streamDeckPlugin
            SHA256SUMS
