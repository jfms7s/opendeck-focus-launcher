name: Release
on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs ${{ matrix.target }}
      - name: Zip the plugin bundle
        run: |
          cd dist
          zip -r ../opendeck-focus-launcher-${{ matrix.target }}.streamDeckPlugin com.jfms7s.focuslauncher.sdPlugin
      - uses: softprops/action-gh-release@v2
        with:
          files: opendeck-focus-launcher-${{ matrix.target }}.streamDeckPlugin
