name: CI
# Replaces the in-repo jobs test, msrv, macos, msrv-macos, audit, quality and audit.yml (delete that
# file: its weekly schedule lives here now; scheduled runs only run `audit`).
# `msrv` must match rust-version in Cargo.toml.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  # Reports the checks as `ci / <job>`: those are the names for the
  # "Protect master" ruleset (see opendeck-plugin-ci's README).
  ci:
    permissions:
      contents: read
      packages: read # the report-only eng-metrics-lab job
    uses: jfms7s/opendeck-plugin-ci/.github/workflows/ci.yml@098bfd0f9d891c2db4f26cd95627e6e6a567563a # v0.1.0
    with:
      # The jobs the ruleset requires: fails if an input above switches one off (skipped counts as green).
      required-jobs: "test msrv macos msrv-macos bundle"
      rust-cache: false
      clippy-darwin: true
      pi-tests: "tests/*.test.mjs"
      bundle-lto: ""
      release-notes-check: true
      msrv: "1.88.0"
      msrv-macos: true
      macos-test-args: "-- --show-output"
      macos-check: "scripts/check-macos-binary.sh {bin}"
      audit: "cargo-audit"
