name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1
      # Replaces `cargo test`: the same tests, instrumented. The fragment waits in
      # RUNNER_TEMP until every test in the job has passed (see the collect step).
      - name: Test with coverage (eng-metrics-lab)
        run: cargo llvm-cov --locked --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
      # Type-checks the macOS code here too (no C dependencies there, so no
      # SDK needed): a Linux-only change that breaks macOS fails fast.
      - run: cargo clippy --target aarch64-apple-darwin --all-targets --locked -- -D warnings
      - name: Property inspector tests
        run: node --test tests/*.test.mjs
      # The Release workflow builds the draft's notes from the README's smoke
      # checklist markers; catch a broken marker here, not on a pushed tag.
      - run: node scripts/release-body.mjs > /dev/null
      # Catches Cargo/manifest version drift, CodePaths and UUID mismatches
      # before a release does, not after.
      - name: Release build and bundle
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          node build.mjs x86_64-unknown-linux-gnu
      # Only reached when every step above passed, so a red test leaves no fragment.
      # macOS-only cfg code isn't compiled here: a known coverage gap.
      - name: Collect coverage fragment (eng-metrics-lab)
        run: |
          mkdir -p .quality
          mv "$RUNNER_TEMP/coverage-rust.lcov" .quality/coverage-rust.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fragments
          path: .quality/coverage-rust.lcov
          include-hidden-files: true
          retention-days: 7

  msrv:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.88.0
      - run: cargo check --all-targets --locked

  # The release ships an Apple Silicon binary: lint, test and package it
  # natively, with the release's signature and start-up checks.
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The [package] name is the first `name =` line in Cargo.toml.
      - name: Binary name from Cargo.toml
        run: echo "BIN=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo clippy --all-targets --locked -- -D warnings
      # --show-output: the macOS backend tests print which path they took
      # (AX windows, or the missing Accessibility permission).
      - run: cargo test --locked -- --show-output
      - name: Property inspector tests
        run: node --test tests/*.test.mjs
      - run: cargo build --release --locked
      - name: Check it is a signed arm64 binary that starts
        run: scripts/check-macos-binary.sh "target/release/$BIN"
      - run: node build.mjs aarch64-apple-darwin

  # The same MSRV check on macOS, as its own job: the master ruleset requires
  # a check named exactly `msrv`, which a matrix would rename.
  msrv-macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.88.0
      - run: cargo check --all-targets --locked

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit

  # eng-metrics-lab (report-only): duplication, complexity and dead code; the collector picks up the artifact.
  quality:
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-fragments
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true
